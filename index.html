<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur YAML Pomerium</title>
    <style>
        /* On force la page à prendre toute la hauteur */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Empêche le scroll de la page entière */
            font-family: sans-serif;
        }

        /* Conteneur principal en Flexbox */
        .main-container {
            display: flex;
            height: 100vh; /* 100% de la hauteur de l'écran */
            width: 100vw;
        }

        /* Zone Blockly (à gauche) */
        #blocklyArea {
            flex: 3; /* Prend 75% de la largeur */
            position: relative;
        }
        #blocklyDiv {
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
        }

        /* Zone de sortie (à droite) */
        .output-panel {
            flex: 1; /* Prend 25% de la largeur */
            display: flex;
            flex-direction: column;
            border-left: 2px solid #ccc;
            background: #f8f9fa;
        }

        .output-header {
            padding: 10px;
            background: #eee;
            border-bottom: 1px solid #ccc;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #output {
            margin: 0;
            padding: 15px;
            overflow-y: auto;
            flex-grow: 1;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            color: #333;
            white-space: pre-wrap;
        }

        button {
            cursor: pointer;
            padding: 8px 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
        }
        button:hover { background-color: #45a049; }
    </style>
</head>
    <body>

        <div class="main-container">
            <div id="blocklyArea">
                <div id="blocklyDiv"></div>
            </div>

            <div class="output-panel">
                <div class="output-header">
                    <strong>Résultat YAML</strong>
                    <button onclick="generateYaml()">Générer ⚡</button>
                </div>
                <pre id="output">Le code apparaîtra ici...</pre>
            </div>
        </div>

        <script src="https://unpkg.com/blockly/blockly_compressed.js"></script>
        <script src="https://unpkg.com/blockly/blocks_compressed.js"></script>
        <script src="https://unpkg.com/blockly/javascript_compressed.js"></script>
        <script src="https://unpkg.com/blockly/msg/en.js"></script>

        <!-- <script src="generator/yaml-generator.js"></script> -->
        <script type="module" src="./blocks/custom_blocks.js"></script>
        <script type="module" src="./blocks/constants.js"></script>
        <script type="module" src="main.js"></script>

        <script>
            // Optionnel : Redimensionnement automatique si la fenêtre change
            window.addEventListener('resize', function() {
                Blockly.svgResize(workspace);
            }, false);
        </script>
    </body>
</html>
